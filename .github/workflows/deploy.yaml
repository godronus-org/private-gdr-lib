name: Deploy

# A library deploys nothing: a release tag runs the tests (toolkit, kind
# "library"), then exports the release to the public mirror (T34).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository_owner == 'godronus-org'
    uses: godronus-org/toolkit/.github/workflows/deploy.yaml@v1
    secrets: inherit

  # Release tag only: publish the release to the public mirror (T34).
  export:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    uses: godronus-org/toolkit/.github/workflows/export.yaml@v1
    secrets: inherit
